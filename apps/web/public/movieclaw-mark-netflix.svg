<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 160" role="img" aria-label="MovieClaw">
  <!-- MovieClaw M 字标(Netflix 主题):N 标丝带 DNA——侧条 #87040d→#b1060f 圆柱渐变,
       亮红 #e50914 折带中部折返成 V。V 带顶端盖满侧条整个顶边(像 N 标斜条压住
       左条顶边,字母标顶端合并为一整条亮线,侧条只在斜边以下渐露为暗楔)。
       落影楔形沿斜边延长到渐变归零的等距线处,无可见切边;折点净亮。 -->
  <defs>
    <linearGradient id="mc-m-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#87040d"/>
      <stop offset="0.55" stop-color="#9c060f"/>
      <stop offset="1" stop-color="#b1060f"/>
    </linearGradient>
    <linearGradient id="mc-m-shadow-l" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-11.3" y2="3.9">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mc-m-shadow-r" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="121.3" y2="3.9">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="30" height="160" fill="url(#mc-m-bar)"/>
  <rect x="80" width="30" height="160" fill="url(#mc-m-bar)"/>
  <path d="M0 0 30 86.2V122.6L0 36.5Z" fill="url(#mc-m-shadow-l)"/>
  <path d="M110 0 80 86.2V122.6L110 36.5Z" fill="url(#mc-m-shadow-r)"/>
  <path d="M0 0H44L55 47.8L66 0H110L55 158Z" fill="#e50914"/>
</svg>
